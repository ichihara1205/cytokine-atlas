id: IL18
symbol: "IL-18"
gene: IL18
aliases: [IGIF, IL-1F4, IFN-gamma-inducing factor]

families: {structure: il1-structural, receptor: il1r-family, naming: interleukin}

receptor:
  - name: "IL18R1 + IL18RAP"
    subunits: [IL18R1, IL18RAP]
    note: "IL-18 受容体は IL-18Rα と IL-18Rβ からなる。デコイの IL-18BP が結合を妨げて活性を中和する"
    source: "PMID:24332029"
    status: verified

downstream: {primary: "MyD88 → IRAK → NF-κB", secondary: [], source: null, status: inferred}
form:
  secretion: latent
  latency: "不活性な前駆体として作られ、IL-1β と同じくカスパーゼ1切断を要する。前駆体は健常時からほぼ全ての間葉系細胞に存在する"
  source: "PMID:24332029"
  status: verified
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
range: {mode: paracrine, note: null, source: null, status: inferred}

producers:
  kc_ikc: {level: 2, source: "PMID:39355871", status: verified,
     note: "KC のインフラマソームがカスパーゼ1を活性化し IL-18 の成熟を開始する（出典はこの細胞種の生体内での性質を述べたもの。使っている株・iPS由来細胞がそれを再現するかは別）"}
  mac_thp1:       {level: 2, source: null, status: inferred}
  hepatocyte_pxb: {level: 1, source: null, status: inferred}

receivers:
  t_nk:    {level: 3, source: null, status: inferred}
  kc_ikc:  {level: 1, source: null, status: inferred}
  hsc_lx2: {level: 2, source: "PMID:39355871", status: verified,
     note: "IL-18 は HSC の活性化に直接寄与する（出典はこの細胞種の生体内での性質を述べたもの。使っている株・iPS由来細胞がそれを再現するかは別）"}

effects:
  fibrosis: 0
  inflammation: 1
  lipid: 0
  differentiation: 0
  note: "主作用は T/NK からの IFN-γ 誘導。系内に T/NK がいない共培養では効果がほぼ現れない"
  source: null
  status: inferred

notes:
  - text: "IL-18BP は恒常状態でも IL-18 の20倍のモル過剰で血中に存在する。ELISA の総 IL-18 は結合型を含むので、総量が高くても遊離型が働いているとは限らない"
    source: "PMID:24332029"
    status: verified

refs:
  - {citation: "Garlanda C, Dinarello CA, Mantovani A. The interleukin-1 family: back to the future. Immunity 2013;39:1003-18. doi:10.1016/j.immuni.2013.11.010", pmid: "24332029", doi: "10.1016/j.immuni.2013.11.010"}
