id: IL34
symbol: "IL-34"
gene: IL34
aliases: [IL-34, C16orf77]

families: {structure: short-chain-4-helix, receptor: csf1r-shared, naming: csf-naming}

receptor:
  - name: "CSF1R"
    subunits: [CSF1R]
    note: "CSF1 と同じ受容体。CSF1R は CSF-1 と IL-34 の両方で活性化される。加えて PTPRZ1 と CD138(SDC1) にも結合するとされる"
    source: "PMID:24890514"
    status: verified

downstream: {primary: "CSF1R → PI3K/AKT", secondary: ["ERK"], source: null, status: inferred}
form:
  secretion: soluble
  latency: null
  source: null
  status: inferred
  oligomer: homodimer
  oligomer_note: "ホモ二量体の増殖因子。CSF1 と構造は違うが同じ受容体を使う"
  oligomer_source: "PMID:24890514"
range: {mode: paracrine, note: null, source: null, status: inferred}

producers:
  hepatocyte_pxb: {level: 2, source: null, status: inferred}
  hsc_lx2:        {level: 2, source: null, status: inferred}
  lsec_tmnk1:     {level: 1, source: null, status: inferred}

receivers:
  kc_ikc:   {level: 3, source: null, status: inferred}
  premac:   {level: 2, source: null, status: inferred}
  mac_thp1: {level: 2, source: null, status: inferred}
  kc_pkc: {level: 3, source: null, status: inferred, note: "CSF1 と並ぶ CSF1R リガンド。組織常在性の維持に関わる"}

effects:
  fibrosis: 1
  inflammation: 0
  lipid: 0
  differentiation: 2
  note: "組織常在マクロファージの維持。CSF1 と同じ受容体だが作用は完全には一致しない"
  source: null
  status: inferred

notes:
  - text: "IL 番号を持つのに IL ファミリーのどれとも構造が違い、CSF1 と受容体を共有する。IL 番号で探す限り CSF1 の同族であることに辿り着けない、命名軸のズレの代表例"
    source: "PMID:24890514"
    status: verified
  - text: "肝細胞由来の IL-34 が iKC の常在性を支えている可能性がある。CSF1 とどちらが効いているかは受容体共有のため上清濃度だけでは分けられない"
    source: null
    status: inferred

refs:
  - {citation: "Stanley ER, Chitu V. CSF-1 receptor signaling in myeloid cells. Cold Spring Harb Perspect Biol 2014;6:a021857", pmid: "24890514"}
