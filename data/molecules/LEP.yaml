notes:
  - text: "産生元が系外の脂肪細胞のみ。肝側は受容体を持つのに出し手が系内にいない『受けるだけ』の分子で、NASH を再現するなら脂肪細胞か外部添加が要る"
    source: null
    status: inferred
  - text: "『ホルモン』『アディポカイン』として扱われるが、構造は IL-6 型の長鎖4ヘリックス、受容体もクラスI、下流も JAK2/STAT3。分類上はサイトカインそのもので、3軸で見ると IL-6 群のすぐ隣に来る"
    source: null
    status: inferred
