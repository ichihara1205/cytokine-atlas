id: CXCL12
symbol: "CXCL12/SDF-1"
gene: CXCL12
aliases: [SDF-1, PBSF, SCYB12]

families: {structure: chemokine-structural, receptor: chemokine-gpcr, naming: chemokine-numbering}

receptor:
  - name: "CXCR4"
    subunits: [CXCR4]
    note: "CXCL12 は CXCR4 を介して働き、ACKR3 がその量を調節する。CXCL12/CXCR4/ACKR3 はケモカイン網で唯一、生存に必須のノード"
    source: "PMID:29637711"
    status: verified

downstream: {primary: "Gi → PI3K/AKT → 遊走・生存", secondary: ["ERK"], source: null, status: inferred}
form:
  secretion: soluble
  latency: null
  source: null
  status: inferred
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
range: {mode: paracrine, note: "基質に固定されてニッチを作る", source: null, status: inferred}

producers:
  lsec_tmnk1: {level: 3, source: null, status: inferred}
  lsec_ilsec: {level: 3, source: null, status: inferred}
  hsc_lx2:    {level: 2, source: null, status: inferred}
  hsc_qhsc: {level: 2, source: null, status: inferred, note: "静止期でも構成的に出す。炎症誘導性ではない"}
  lsec_ilsec: {level: 3, source: null, status: inferred, note: "構成的に出してニッチを作る。不死化株の TMNK-1 は有窓構造を失っていることが多く、iPS 由来の iLSEC のほうが類洞内皮の性質を保つ可能性がある"}

receivers:
  hsc_lx2:     {level: 2, source: null, status: inferred}
  premac:      {level: 2, source: null, status: inferred}
  hepatoblast: {level: 1, source: null, status: inferred}
  t_nk:        {level: 2, source: null, status: inferred}

effects:
  fibrosis: 1
  inflammation: 0
  lipid: 0
  differentiation: 1
  note: "恒常的に出る構成的ケモカインで、炎症誘導性ではない。他のケモカインと同じ枠で読まない"
  source: null
  status: inferred

notes:
  - text: "他のケモカインが炎症で誘導されるのに対し、これは定常状態のニッチ形成因子。CXCL12 は最も原始的なケモカインで進化的に強く保存され、心臓・脳・血管・造血系の発生に必須。骨髄で造血幹細胞を支えるニッチの中核でもある"
    source: "PMID:29637711"
    status: verified

refs:
  - {citation: "Hughes CE, Nibbs RJB. A guide to chemokines and their receptors. FEBS J 2018;285:2944-2971. doi:10.1111/febs.14466", pmid: "29637711", doi: "10.1111/febs.14466"}
