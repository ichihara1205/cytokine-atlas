effects:
  fibrosis: 0
  inflammation: 2
  lipid: 0
  differentiation: 0
  note: "作用は好中球動員。系内に好中球がいなければ効果が現れない"
  source: null
  status: inferred

notes:
  - text: "系内のほぼ全細胞が出すのに、受け手は系外の好中球しかいない。この系で最も典型的な『出るだけ』の分子。ELISA で高値が出やすいが、系の中では誰も受け取っていない"
    source: null
    status: inferred
  - text: "IL-8 の名で広く通っているが HGNC 承認シンボルは CXCL8。IL 番号を持つ唯一級のケモカインで、IL として検索するとケモカイン一族から外れる"
    source: null
    status: inferred

