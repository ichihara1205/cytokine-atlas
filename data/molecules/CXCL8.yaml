id: CXCL8
symbol: "CXCL8/IL-8"
gene: CXCL8
aliases: [IL8, IL-8, NAP-1, SCYB8]

families: {structure: chemokine-structural, receptor: chemokine-gpcr, naming: chemokine-numbering}

receptor:
  - name: "CXCR1 / CXCR2"
    subunits: [CXCR1, CXCR2]
    note: "CXCL8 は CXCR1 と CXCR2 の両方を活性化する。CXCR2 は7つの ELR+ CXC ケモカイン全てに無差別に結合し、CXCL8 はその ELR+ の一つ"
    source: "PMID:24218476"
    status: verified

downstream: {primary: "Gi → PI3K/PLCβ → 好中球遊走", secondary: ["ERK"], source: null, status: inferred}
form:
  secretion: soluble
  latency: null
  source: null
  status: inferred
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
range: {mode: paracrine, note: null, source: null, status: inferred}

producers:
  hepatocyte_pxb: {level: 2, source: null, status: inferred}
  hsc_lx2:        {level: 3, source: null, status: inferred}
  lsec_tmnk1:     {level: 3, source: null, status: inferred}
  kc_ikc:         {level: 3, source: null, status: inferred}
  mac_thp1:       {level: 3, source: null, status: inferred}
  kc_pkc: {level: 3, source: null, status: inferred, note: "iKC の成熟度を測る基準として置く初代クッパー細胞。iKC のデータをこの値と直接比較しない"}
  lsec_ilsec: {level: 2, source: null, status: inferred, note: "好中球動員。受け手は系内にいない"}

