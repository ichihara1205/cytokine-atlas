notes:
  - text: "GDF8 の名で呼ばれることが多いが HGNC 承認シンボルは MSTN。GDF 番号で検索すると TGF-βスーパーファミリーの一員であることに気づきにくい"
    source: null
    status: inferred
  - text: "産生は骨格筋で、この系には出し手がいない。一方でアクチビンA と受容体（ACVR2/ALK4）を共有するため、星細胞が理論上は応答しうる（level 1）。したがって判定は『受けるだけ』になる。ただしこの応答は確立しておらず、実際に効いている証拠はない"
    source: null
    status: inferred

refs:
