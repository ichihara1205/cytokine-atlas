id: HGF
symbol: "HGF"
gene: HGF
aliases: [肝細胞増殖因子, SF, スキャッター因子, HPTA]

families: {structure: hgf-plasminogen-structural, receptor: rtk-met, naming: growth-factor-naming}

receptor:
  - name: "MET"
    subunits: [MET]
    source: null
    status: inferred

downstream: {primary: "MET → GAB1 → PI3K/AKT", secondary: ["ERK", "STAT3"], source: null, status: inferred}
form:
  secretion: latent
  latency: "不活性な一本鎖 pro-HGF として分泌され、HGFAC・マトリプターゼ・ヘプシンなどのセリンプロテアーゼ切断で二本鎖の活性型になる"
  source: null
  status: inferred
  oligomer: heterodimer
  oligomer_note: "一本鎖の pro-HGF が切断され、α鎖とβ鎖がジスルフィドで繋がった二本鎖になる"
  oligomer_source: null
range: {mode: paracrine, note: "ヘパラン硫酸に結合して基質に留まる", source: null, status: inferred}

producers:
  hsc_lx2: {level: 3, source: null, status: inferred}
  hsc_qhsc: {level: 3, source: null, status: inferred,
     note: "静止期星細胞は HGF の主要産生源。活性化に伴い産生が落ちるため、既に部分活性化した LX-2 では過小評価になる"}
  lsec_tmnk1: {level: 2, source: "PMID:39355871", status: verified,
     note: "LSEC が Wnt2a とともに HGF を分泌し、HSC を静止状態に保ち肝細胞に再生を促す（出典はこの細胞種の生体内での性質を述べたもの。使っている株・iPS由来細胞がそれを再現するかは別）"}
  kc_ikc: {level: 1, source: null, status: inferred}
  lsec_ilsec: {level: 2, source: null, status: inferred,
     note: "肝細胞の支持因子。不死化株の TMNK-1 は有窓構造を失っていることが多く、iPS 由来の iLSEC のほうが類洞内皮の性質を保つ可能性がある"}

receivers:
  hepatocyte_pxb: {level: 3, source: "PMID:39355871", status: verified,
     note: "LSEC 由来の HGF が肝細胞の増殖に必要。肝切除モデルで示されている（出典はこの細胞種の生体内での性質を述べたもの。使っている株・iPS由来細胞がそれを再現するかは別）"}
  hepatoblast:    {level: 3, source: null, status: inferred}
  lsec_tmnk1:     {level: 1, source: null, status: inferred}
  hsc_lx2: {level: 2, source: "PMID:39355871", status: verified,
     note: "LSEC が分泌する Wnt2a と HGF が HSC を静止状態に保つ（出典はこの細胞種の生体内での性質を述べたもの。使っている株・iPS由来細胞がそれを再現するかは別）"}
  hsc_qhsc: {level: 2, source: "PMID:39355871", status: verified,
     note: "同上。静止状態の維持を受ける側"}

effects:
  fibrosis: -1
  inflammation: -1
  lipid: -1
  differentiation: 2
  note: "肝細胞の生存・増殖・成熟を支え、星細胞の活性化には拮抗的に働く"
  source: null
  status: inferred

relations:                     # 分子間辺。受容体の共有は書かない（受容体軸から導出される）
  - {type: opposes, target: TGFB1, source: null, status: inferred,
     note: "星細胞の活性化に拮抗する。線維化の実行因子である TGF-β1 と逆向きに働く"}

notes:
  - text: "星細胞が出して肝細胞が受ける、系内で完結する中心的な軸。星細胞を『線維化の悪玉』とだけ見ると、この支持機能を見落とす"
    source: null
    status: inferred
  - text: "pro-HGF のまま分泌されるので、ELISA の総量と活性型の量は一致しない。プロテアーゼ環境が整っていない培養系では、量があっても効いていない可能性がある"
    source: null
    status: inferred
