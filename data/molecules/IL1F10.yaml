id: IL1F10
symbol: "IL-38"
gene: IL1F10
aliases: [IL-38, IL1HY2, IL-1F10]

families: {structure: il1-structural, receptor: il1r-family, naming: interleukin}

receptor:
  - name: "IL1RL2(IL-36R)（部分的な拮抗）"
    subunits: [IL1RL2]
    note: "IL-1R1・IL-1R3・IL-18Rα には結合せず IL-36R にのみ結合する。IL-36R の部分的な受容体拮抗剤で、遮断の強さは IL-1Ra より弱い"
    source: "PMID:24332029"
    status: verified

downstream: {primary: "なし（拮抗によりシグナルを抑える）", secondary: [], source: "PMID:24332029", status: verified}

form:
  secretion: both
  latency: "152アミノ酸の前駆体として作られ、分泌シグナル配列を持たない。カスパーゼ1の切断部位も無く、天然のN末端は未同定"
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
  source: "PMID:24332029"
  status: verified
range: {mode: paracrine, note: null, source: null, status: inferred}

producers:
  hepatocyte_pxb: {level: 0, source: null, status: inferred, note: "産生は皮膚・扁桃などが主。肝での産生は確立していないと判断"}
  kc_ikc:         {level: 1, source: null, status: inferred}

receivers:
  hepatocyte_pxb: {level: 0, source: null, status: inferred, note: "IL-36 受容体の発現は上皮でも限定的。肝細胞での応答は確立していない"}

effects:
  fibrosis: 0
  inflammation: -1
  lipid: 0
  differentiation: 0
  note: "IL-1ファミリーの受容体拮抗剤の一つ。作用は遮断による間接効果"
  source: "PMID:24332029"
  status: verified

notes:
  - text: "IL-38 の名で流通するが HGNC 承認シンボルは IL1F10。IL-38 は alias であって承認シンボルではないため、シンボルで検索すると取りこぼす"
    source: null
    status: inferred
  - text: "IL-1ファミリーの3つの受容体拮抗剤の一つ（IL-1Ra・IL-36Ra・IL-38）。遺伝子も染色体2番の IL-1 クラスタ内で IL-1Ra・IL-36Ra の隣に並ぶ"
    source: "PMID:24332029"
    status: verified

refs:
