id: CCL2
symbol: "CCL2/MCP-1"
gene: CCL2
aliases: [MCP-1, MCAF, SCYA2]

families: {structure: chemokine-structural, receptor: chemokine-gpcr, naming: chemokine-numbering}

receptor:
  - name: "CCR2"
    subunits: [CCR2]
    note: "CCR2 は MCP ファミリー（CCL2・CCL7・CCL13）の高親和性受容体。ACKR1/ACKR2 が非シグナル型のスカベンジャーとして量を調節する"
    source: "PMID:24218476; PMID:29637711"
    status: verified

downstream: {primary: "Gi → PI3Kγ → 細胞遊走", secondary: ["ERK"], source: null, status: inferred}
form:
  secretion: soluble
  latency: null
  source: null
  status: inferred
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
range: {mode: paracrine, note: "グリコサミノグリカン(GAG)への結合が、組織内での半減期・勾配・作用する場所を決める。内皮表面での提示にも要る",
        source: "PMID:29637711", status: verified}

producers:
  hsc_lx2:        {level: 3, source: null, status: inferred}
  lsec_tmnk1:     {level: 3, source: null, status: inferred}
  hepatocyte_pxb: {level: 2, source: null, status: inferred}
  kc_ikc:         {level: 2, source: null, status: inferred}
  lsec_ilsec: {level: 2, source: null, status: inferred, note: "単球動員。不死化株の TMNK-1 は有窓構造を失っていることが多く、iPS 由来の iLSEC のほうが類洞内皮の性質を保つ可能性がある"}

receivers:
  mac_thp1: {level: 3, source: null, status: inferred}
  premac:   {level: 2, source: null, status: inferred}

effects:
  fibrosis: 1
  inflammation: 2
  lipid: 1
  differentiation: 0
  note: "作用は単球動員という細胞移動であって、標的細胞の形質転換ではない"
  source: null
  status: inferred

notes:
  - text: "静置共培養では『動員』という主作用が再現されない。上清濃度が高くても系内で意味のある仕事をしているとは限らない"
    source: null
    status: inferred

refs:
  - {citation: "Bachelerie F, et al. International Union of Basic and Clinical Pharmacology. LXXXIX. Update on the extended family of chemokine receptors and introducing a new nomenclature for atypical chemokine receptors. Pharmacol Rev 2013;66:1-79. doi:10.1124/pr.113.007724", pmid: "24218476", doi: "10.1124/pr.113.007724"}
  - {citation: "Hughes CE, Nibbs RJB. A guide to chemokines and their receptors. FEBS J 2018;285:2944-2971. doi:10.1111/febs.14466", pmid: "29637711", doi: "10.1111/febs.14466"}
