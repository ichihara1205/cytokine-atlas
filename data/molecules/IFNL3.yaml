id: IFNL3
symbol: "IFN-λ3"
gene: IFNL3
aliases: [IL-28B, IL28B, III型IFN]

families: {structure: class2-helical, receptor: il10rb-shared, naming: interferon-naming}

receptor:
  - name: "IFNLR1 + IL10RB"
    subunits: [IFNLR1, IL10RB]
    note: "IFNLR1 と IL10RB のヘテロ二量体。IL10RB は IL-10・IL-22 と共有する共通鎖。IFNLR1 の発現が上皮に限られるため作用範囲が狭い"
    source: "PMID:42213608; PMID:26200010"
    status: verified

downstream: {primary: "JAK1/TYK2 → STAT1/STAT2 + IRF9（ISGF3）", secondary: [], source: "PMID:42213608", status: verified}
form:
  secretion: soluble
  latency: null
  source: null
  status: inferred
  oligomer: monomer
  oligomer_note: "単量体として受容体に結合する"
  oligomer_source: null
range: {mode: paracrine, note: null, source: null, status: inferred}

producers:
  hepatocyte_pxb: {level: 2, source: null, status: inferred}
  kc_ikc:         {level: 2, source: null, status: inferred}
  mac_thp1:       {level: 1, source: null, status: inferred}

receivers:
  hepatocyte_pxb: {level: 3, source: null, status: inferred}

effects:
  fibrosis: 0
  inflammation: 1
  lipid: 0
  differentiation: 0
  note: "I型 IFN と同じ ISG を誘導するが、受容体が上皮限定のため全身性の副作用が小さい"
  source: null
  status: inferred

notes:
  - text: "旧名 IL-28B。名前は IL、機能は IFN、受容体鎖は IL-10 系という三重のズレを1分子で体現している。HGNC 承認シンボルは IFNL3 で、IL28B は旧シンボル"
    source: "PMID:26200010; PMID:42213608"
    status: verified
  - text: "IFNLR1 が肝細胞に限局するため、同じ ISG 応答でも受け手が肝細胞に絞られる。IFN-β との対比で読むと受容体分布の意味が見える"
    source: null
    status: inferred

refs:
  - {citation: "Lazear HM, Nice TJ, Diamond MS. Interferon-λ: Immune Functions at Barrier Surfaces and Beyond. Immunity 2015;43:15-28", pmid: "26200010"}
  - {citation: "Novotny LA, et al. Mechanisms of Differential Signal Transduction by Interferon Lambda Receptor 1 Variants. J Innate Immun 2026", pmid: "42213608"}
