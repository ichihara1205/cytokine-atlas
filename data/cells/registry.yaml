# 細胞レジストリ
# data/cells/ 配下は「1ファイル=1細胞（マッピング）」でも「1ファイル=複数細胞（リスト）」でもよい。
# ここでは一覧性を優先して1ファイルにまとめている。増えたら分割してよい。
#
# 注意: 通信辺（molecule の producers/receivers）と分化辺（下の differentiation.from）は
#       別のグラフとして描画される。ここには分化辺だけを書く。
#
# --- 名前と分類の持ち方 -------------------------------------------------
# label_generic  総称。図・一覧の主表示（Hepatocyte / HSC / LSEC / KC …）
# label_short    実際に使っている細胞の呼称（PXB / LX-2 / iKC …）
# label_ja       正式な説明的名称
#
# stage と origin は必ず分けて持つ。1つのフィールドに潰さない。
#   stage:  pluripotent | progenitor | mature      分化段階（時間軸のどこにいるか）
#   origin: primary | line | ipsc_derived | null   由来（そのデータをどう読むべきか）
#
# これは無関係な2軸である。「不死化株かどうか」と「成熟しているかどうか」は独立で、
# LX-2 は mature かつ line、iKC は mature かつ ipsc_derived、qHSC は mature かつ primary。
# 同じ HSC でも株か初代かでデータの意味が変わるので、総称だけを見て同一視してはならない。
#
# origin: null は「実際には培養していない参照ノード」。系外の細胞に使う。
#
# in_system: false = 系外。「受け手が系内にいない」ことを判定するために必須。
# 出典の付いていない differentiation は status: inferred / todo のまま。

- id: hepatocyte_pxb
  label_generic: "Hepatocyte"
  label_short: PXB
  label_ja: PXB細胞（ヒト初代肝細胞）
  stage: mature
  origin: primary
  lineage: hepatocyte
  color: "#E8935C"
  in_system: true
  notes:
    - text: "キメラマウス由来のヒト初代肝細胞。株ではないためロット差を前提に読む"
      source: null
      status: inferred

- id: hsc_lx2
  label_generic: "HSC"
  label_short: LX-2
  label_ja: LX-2（不死化ヒト肝星細胞）
  stage: mature
  origin: line
  state: activated
  lineage: stellate
  color: "#B57BE0"
  in_system: true
  notes:
    - text: "既に部分活性化した表現型。静止期星細胞（qHSC）の代用にはならない。同じ HSC でも qHSC のデータと直接比較しない"
      source: null
      status: inferred

