- id: tgf-beta-superfamily
  axis: structure
  label_ja: TGF-βスーパーファミリー
  parent: null
  children: [tgfb-smad23-branch, bmp-smad158-branch]
  members: [TGFB1, TGFB2, TGFB3, BMP2, BMP4, BMP6, GDF2, MSTN, GDF15, INHBA, AMH, NODAL]
  defining_feature: "システインノット構造。二量体で I型/II型セリンスレオニンキナーゼ受容体に結合する"
  mismatch:
    - member: null
      note: "BMP・GDF・アクチビン・ミオスタチン・AMH・nodal は名前が全く揃っていないが、すべてこの一族。SMAD1/5/8 枝と SMAD2/3 枝に分岐するだけで、構造上は同じ折りたたみ"
      source: "PMID:27141051"
      status: verified
    - member: MSTN
      note: "ミオスタチン。GDF8 の名で呼ばれることが多いが HGNC 承認シンボルは MSTN（GDF8 は旧シンボル）"
      source: null
      status: inferred
    - member: GDF15
      note: "構造は本ファミリーだが受容体は GFRAL+RET で、I型/II型セリンスレオニンキナーゼ受容体も SMAD も使わない。構造軸と受容体軸が完全に食い違う唯一級の例"
      source: "PMID:28846099"
      status: verified
  source: "PMID:27141051"
  status: verified

