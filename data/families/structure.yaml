      note: "レプチン。「アディポカイン」「食欲調節ホルモン」として語られるが、構造は IL-6 型の長鎖4ヘリックスバンドルで、受容体 LEPR もクラスIサイトカイン受容体、下流も JAK2 → STAT3。分類上はサイトカインそのもの"
      source: null
      status: inferred
    - member: CSF3
      note: "G-CSF。CSF という別系統の名を持つが構造は IL-6 型。受容体 CSF3R も gp130 に近縁のクラスIサイトカイン受容体"
      source: null
      status: inferred
  source: null
  status: inferred

