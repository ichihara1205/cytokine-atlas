- id: il1r-family
  axis: receptor
  label_ja: IL-1受容体ファミリー（TIRドメイン）
  parent: null
  children: []
  members: [IL1A, IL1B, IL18, IL33, IL36A, IL36B, IL36G, IL37, IL1RN, IL1F10]
  defining_feature: "細胞内 TIR ドメインを持ち MyD88 → NF-κB を動かす。TLR と下流を共有する。IL-1 ファミリーは作動性7分子・受容体拮抗剤3分子・抗炎症性1分子(IL-37)からなり、受容体側は6鎖が4つのシグナル複合体を作るほか、デコイ受容体(IL-1R2, IL-18BP)を持つ"
  mismatch:
    - member: IL1RN
      note: "IL-1Ra。IL-1 ファミリーの3つの受容体拮抗剤の一つで、受容体に結合してもシグナルを出さない。「受容体を共有する」ことと「同じ作用を持つ」ことが別であることを示す"
      source: "PMID:24332029"
      status: verified
    - member: IL33
      note: "受容体は IL1RL1(ST2)。核内でクロマチンにも結合し、細胞死に伴って放出されるアラーミンとして働く。分泌シグナル配列を持たない点で古典的サイトカインの枠から外れる"
      source: null
      status: inferred
  source: null
  status: inferred

- id: fgfr-klotho
  axis: receptor
  label_ja: FGFR + Klotho（内分泌型FGF）
  parent: null
  children: []
  members: [FGF19, FGF21, FGF23]
  defining_feature: "αKlotho / βKlotho は内分泌型 FGF 受容体複合体の必須構成要素で、FGF19・FGF21・FGF23 が FGFR に高親和性で結合するために要求される。FGF19 は摂食時に腸から出て肝細胞の βKlotho–FGFR4 に、FGF21 は絶食時に肝から出て脂肪細胞の βKlotho–FGFR1c に結合する"
  mismatch:
    - member: null
      note: "FGF19/21/23 だけが内分泌型。他の FGF は同じ番号体系でも傍分泌でヘパリン依存であり、性質が全く違う"
      source: "PMID:30455427"
      status: verified
  source: "PMID:30455427"
  status: verified

- id: tnfr-superfamily
  axis: receptor
  label_ja: TNF受容体スーパーファミリー
  parent: null
  children: []
  members: [TNF, LTA, TNFSF10, FASLG, CD40LG, TNFSF12]
  defining_feature: "TNF/TNFR スーパーファミリーは19のリガンドと29の受容体からなり、細胞の分化・生存・プログラム細胞死を制御する。細胞内でデスドメイン系（アポトーシス）と TRAF 系（NF-κB）に分岐する"
  source: "PMID:30354964"
  status: verified

