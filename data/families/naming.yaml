- id: csf-naming
  axis: naming
  label_ja: CSF命名（コロニー刺激因子）
  parent: null
  children: []
  members: [CSF1, CSF2, CSF3, IL34]
  defining_feature: "骨髄細胞のコロニー形成を促す活性にちなむ機能由来の名。M-CSF / GM-CSF / G-CSF"
  mismatch:
    - member: IL34
      note: "CSF1 と同じ CSF1R を共有するのに、CSF ではなく IL の番号が付いている。発見が遅く、既に CSF の命名枠が閉じていたことによる歴史的事故"
      source: "PMID:24890514"
      status: verified
    - member: CSF3
      note: "G-CSF。CSF の名を持つが構造は IL-6 型の長鎖4ヘリックス。CSF1（M-CSF）とは構造も受容体も無関係で、CSF という括りは活性の記述にすぎない"
      source: null
      status: inferred
  source: null
  status: inferred

- id: growth-factor-naming
  axis: naming
  label_ja: 増殖因子命名（〜growth factor）
  parent: null
  children: []
  members: [HGF, EGF, VEGFA, PDGFB, IGF1, FGF2]
  defining_feature: "「どの細胞を増やしたか」という発見時のアッセイ系にちなむ名。標的細胞名がそのまま分子名になっている"
  mismatch:
    - member: HGF
      note: "肝細胞増殖因子の名だが、実際には上皮全般の運動性・生存・形態形成を担う。構造はプラスミノーゲン様であって他の増殖因子とは無縁"
      source: null
      status: inferred
    - member: null
      note: "発見時のアッセイ系に由来する名前なので、その因子の生体内での主な役割とは限らない。VEGF が血管以外に、PDGF が血小板以外に働くのはその例"
      source: null
      status: inferred
  source: null
  status: inferred

- id: adipokine-naming
  axis: naming
  label_ja: アディポカイン
  parent: null
  children: []
  members: [LEP, ADIPOQ]
  defining_feature: "脂肪組織から分泌されるという産生元にちなむ括り。構造にも受容体にも共通性はない"
  mismatch:
    - member: null
      note: "「アディポカイン」は産生細胞による括りであって、構造でも受容体でもない第4の論理。レプチンは IL-6 型ヘリックス＋クラスI受容体、アディポネクチンは TNF 型＋逆向き7回膜貫通と、中身は全く別物"
      source: null
      status: inferred
  source: null
  status: inferred

