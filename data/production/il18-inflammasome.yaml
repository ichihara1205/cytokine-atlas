id: il18-inflammasome
molecule: IL18
label_ja: IL-18 — 恒常的な前駆体とインフラマソーム
outcome: >-
  IL-1β と同じカスパーゼ1依存だが、前駆体が定常状態から存在する点が違う。
  したがって転写を上げなくてもシグナル2だけで放出が起こりうる。
  さらに細胞外で IL18BP に捕まるため、上清の総量と遊離型が一致しない。
steps:
  - id: tx
    kind: transcription
    label: "pro-IL-18 は定常的に発現"
    note: "IL-18 の前駆体は健常時からほぼ全ての間葉系細胞に存在する"
    source: "PMID:24332029"
    status: verified
  - id: pro
    kind: proform
    label: "pro-IL-18 が細胞質に存在"
  - id: signal2
    kind: trigger
    signal: 2
    label: "シグナル2（インフラマソーム活性化）"
  - id: proc
    kind: processing
    label: "カスパーゼ1による切断"
    protease: CASP1
    source: "PMID:31036962"
    status: verified
  - id: rel
    kind: release
    label: "ガスダーミンDの孔から放出"
    route: gasdermin_pore
    source: "PMID:31036962"
    status: verified
  - id: ext
    kind: extracellular
    label: "IL18BP による捕捉"
    note: "IL-18BP は恒常状態でも IL-18 の20倍のモル過剰で血中に存在し、受容体への結合を妨げて活性を中和する。総 IL-18 の ELISA は結合型を含む"
    source: "PMID:24332029"
    status: verified
source: "PMID:31036962"
status: verified
