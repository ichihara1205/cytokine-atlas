name: build and deploy

# data/ を直したら push するだけでサイトが更新される。
# validate.py が ERROR を出したらここで止まるので、壊れたデータは公開されない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml

      - uses: actions/configure-pages@v5
        id: pages

      # CLAUDE.md §0.3 のビルド前チェック。ERROR が1件でもあれば以降を実行しない
      - name: validate
        run: python3 scripts/validate.py

      - name: build
        env:
          # プロジェクトページは /<repo>/ 配下に出るのでそのパスを渡す
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
